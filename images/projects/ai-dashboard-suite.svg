<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="dash-t dash-d" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title id="dash-t">Client KPI Dashboards — architecture</title>
  <desc id="dash-d">Several data sources are brought together by a Node.js API and served to React KPI dashboards with filters and trend charts.</desc>
