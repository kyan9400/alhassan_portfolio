<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="okkp-t okkp-d" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title id="okkp-t">OKKP Operations Platform — architecture</title>
  <desc id="okkp-d">React and TypeScript single-page app with role-aware dashboards calls a Node.js / Express API with auth, RBAC and modules for employees, violations, reporting and the audit log. The API stores operational and reporting data in PostgreSQL, documents in MongoDB and media in Cloudinary.</desc>
  <defs>
    <pattern id="okkp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="okkp-grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="okkp-fade" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <mask id="okkp-fade-mask"><rect width="1600" height="900" fill="url(#okkp-fade)"/></mask>
    <radialGradient id="okkp-glow-v" cx="260" cy="110" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="okkp-glow-c" cx="1440" cy="880" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="okkp-flow" x1="96" y1="0" x2="1504" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="okkp-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b2b"/>
      <stop offset="1" stop-color="#131320"/>
    </linearGradient>
    <linearGradient id="okkp-title" x1="96" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4f0"/>
    </linearGradient>
    <filter id="okkp-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <style>
    .okkp-flow { opacity: 0; }
    @keyframes okkp-dash { to { stroke-dashoffset: -32; } }
    @keyframes okkp-dash-async { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: no-preference) {
      .okkp-flow { opacity: 1; animation: okkp-dash 1.8s linear infinite; }
      .okkp-async { animation: okkp-dash-async 2.4s linear infinite; }
    }
  </style>
  <rect width="1600" height="900" fill="#0f0f17"/>
  <g mask="url(#okkp-fade-mask)">
    <rect width="1600" height="900" fill="url(#okkp-grid)"/>
    <rect width="1600" height="900" fill="url(#okkp-grid-major)"/>
  </g>
  <rect width="1600" height="900" fill="url(#okkp-glow-v)"/>
  <rect width="1600" height="900" fill="url(#okkp-glow-c)"/>
  <g>
