    <text x="1264" y="147">request / data flow</text>
    <line x1="1196" y1="181" x2="1238" y2="181" stroke="#39b9f0" stroke-width="2.5" stroke-dasharray="8 8"/>
    <path d="M1248 181l-12 -6.5v13z" fill="#35bdef"/>
    <text x="1264" y="189">async / background</text>
  </g><text x="96" y="246" font-size="22" font-weight="600" letter-spacing="2.5" fill="#a78bfa">INGESTION<tspan fill="#71717a" font-weight="400" letter-spacing="0.5">  ·  background, when documents are added</tspan></text><text x="96" y="626" font-size="22" font-weight="600" letter-spacing="2.5" fill="#67e8f9">QUERY<tspan fill="#71717a" font-weight="400" letter-spacing="0.5">  ·  per question</tspan></text><g><path d="M386 338L457 338" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" class="rag-async"/><path d="M0 0l-14 -7.5v15z" fill="#6f7bf4" transform="translate(468 338) rotate(0.00)"/><circle cx="386" cy="338" r="5" fill="#0f0f17" stroke="#7575f4" stroke-width="2.5"/></g><g><path d="M718 338L789 338" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" class="rag-async"/><path d="M0 0l-14 -7.5v15z" fill="#5798f2" transform="translate(800 338) rotate(0.00)"/><circle cx="718" cy="338" r="5" fill="#0f0f17" stroke="#5d91f2" stroke-width="2.5"/></g><g><path d="M1090 338L1161 338" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" class="rag-async"/><path d="M0 0l-14 -7.5v15z" fill="#3bb7f0" transform="translate(1172 338) rotate(0.00)"/><circle cx="1090" cy="338" r="5" fill="#0f0f17" stroke="#41b0f0" stroke-width="2.5"/></g><g><path d="M945 406L945 475" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" class="rag-async"/><path d="M0 0l-14 -7.5v15z" fill="#4ca4f1" transform="translate(945 486) rotate(90.00)"/><circle cx="945" cy="406" r="5" fill="#0f0f17" stroke="#4ca4f1" stroke-width="2.5"/><text x="961" y="446" font-size="22" fill="#c4c4cf" text-anchor="start">chunks</text></g><g><path d="M1338 406L1338 475" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-dasharray="8 10" stroke-linecap="round" class="rag-async"/><path d="M0 0l-14 -7.5v15z" fill="#2ec5