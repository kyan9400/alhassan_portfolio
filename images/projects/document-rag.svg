d="M700 712L769 712" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" class="rag-flow" stroke-dasharray="3 29"/><path d="M0 0l-14 -7.5v15z" fill="#5896f2" transform="translate(780 712) rotate(0.00)"/><circle cx="700" cy="712" r="5" fill="#0f0f17" stroke="#5e8ff3" stroke-width="2.5"/><text x="740" y="698" font-size="22" fill="#c4c4cf" text-anchor="middle">query</text></g><g><path d="M1070 712L1169 712" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/><path d="M1070 712L1169 712" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" class="rag-flow" stroke-dasharray="3 29"/><path d="M0 0l-14 -7.5v15z" fill="#3ab8f0" transform="translate(1180 712) rotate(0.00)"/><circle cx="1070" cy="712" r="5" fill="#0f0f17" stroke="#42aef0" stroke-width="2.5"/><text x="1125" y="698" font-size="22" fill="#c4c4cf" text-anchor="middle">context</text></g><g><path d="M1342 780L1342.0 802.0Q1342 818 1326.0 818.0L229.5 818.0Q216 818 216.0 804.5L216 791" fill="none" stroke="url(#rag-flow)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/><path d="M1342 780L1342.0 802.0Q1342 818 1326.0 818.0L229.5 818.0Q216 818 216.0 804.5L216 791" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" class="rag-flow" stroke-dasharray="3 29"/><path d="M0 0l-14 -7.5v15z" fill="#8266f5" transform="translate(216 780) rotate(-90.00)"/><circle cx="1342" cy="780" r="5" fill="#0f0f17" stroke="#2ec5ef" stroke-width="2.5"/><rect x="628.48" y="796" width="303.04" height="38" rx="19" fill="#141421" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="780" y="823" font-size="22" fill="#d4d4dc" text-anchor="middle">answer</text></g><g><rect x="96" y="270" width="290" height="136" rx="20" fill="url(#rag-node)" stroke="#8068f5" stroke-opacity="0.6" stroke-width="2"/><rect x="98" y="272" width="286" height="132" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.05"/><text x="122" y="310" font-size="22" font-weight="600" letter-spacing="2" fill="#8068f5">01 · SOURCE</text><text x="122" y="348" font-size="28" font-weight="650" fill="#fafafa" letter-spacing="-0.3">Documents</text><text x="122" y="382" font-size="22" fill="#a1a1aa">PDF · Word · Excel</text><g transform="translate(324 290) scale(1)" fill="none" stroke="#8068f5" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" color="#8068f5" opacity="0.95"><path d="M8 2h13l8 8v24H8z"/><path d="M21 2v8h8M13 18h11M13 24h11M13 30h7"/></g></g><g><rect x="468" y="270" width="250" height="136" rx="20" fill="url(#rag-node)" stroke="#6686f3" stroke-opacity="0.6" stroke-width="2"/><rect x="470" y="272" width="246" height="132" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.05"/><text x="494" y="310" font-size="22" font-weight="600" letter-spacing="2" fill="#6686f3">02 · SCAN</text><text x="494" y="348" font-size="28" font-weight="650" fill="#fafafa" letter-spacing="-0.3">OCR</text><text x="494" y="382" font-size="22" fill="#a1a1aa">scans → text</text><g transform="translate(656 290) scale(1)" fill="none" stroke="#6686f3" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" color="#6686f3" opacity="0.95"><path d="M2 11V5a3 3 0 0 1 3-3h6M25 2h6a3 3 0 0 1 3 3v6M34 25v6a3 3 0 0 1-3 3h-6M11 34H5a3 3 0 0 1-3-3v-6"/><path d="M8 18h20"/></g></g><g><rect x="800" y="270" width="290" height="136" rx="20" fill="url(#rag-node)" stroke="#4ca4f1" stroke-opacity="0.6" stroke-width="2"/><rect x="802" y="272" width="286" height="132" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.05"/><text x="826" y="310" font-size="22" font-weight=