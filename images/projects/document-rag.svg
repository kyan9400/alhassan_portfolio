<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="rag-t rag-d" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title id="rag-t">Document Intelligence (RAG) — pipeline</title>
  <desc id="rag-d">Ingestion: PDF, Word and Excel documents go through OCR, chunking with metadata and sentence-transformers embeddings into a FAISS vector index and a keyword index. Query: a client sends a question to a FastAPI service, hybrid retrieval pulls the best chunks from both indexes, and an LLM writes an answer from the retrieved context.</desc>
  <defs>
    <pattern id="rag-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="rag-grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="rag-fade" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </radialGradient>
    <mask id="rag-fade-mask"><rect width="1600" height="900" fill="url(#rag-fade)"/></mask>
    <radialGradient id="rag-glow-v" cx="260" cy="110" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rag-glow-c" cx="1440" cy="880" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rag-flow" x1="96" y1="0" x2="1504" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rag-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b2b"/>
      <stop offset="1" stop-color="#131320"/>
    </linearGradient>
    <linearGradient id="rag-title" x1="96" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4f0"/>
    </linearGradient>
    <filter id="rag-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <style>
    .rag-flow { opacity: 0; }
    @keyframes rag-dash { to { stroke-dashoffset: -32; } }
    @keyframes rag-dash-async { to { stroke-dashoffset: -36; } }
    @media (prefers-reduced-motion: no-preference) {
      .rag-flow { opacity: 1; animation: rag-dash 1.8s linear infinite; }
      .rag-async { animation: rag-dash-async 2.4s linear infinite; }
    }
  </style>
  <rect width="1600" height="900" fill="#0f0f17"/>
  <g mask="url(#rag-fade-mask)">
    <rect width="1600" height="900" fill="url(#rag-grid)"/>
    <rect width="1600" height="900" fill="url(#rag-grid-major)"/>
  </g>
  <rect width="1600" height="900" fill="url(#rag-glow-v)"/>
  <rect width="1600" height="900" fill="url(#rag-glow-c)"/>
  <g>
    <rect x="96" y="96" width="44" height="4" rx="2" fill="url(#rag-flow)"/>
    <text x="96" y="152" font-size="40" font-weight="700" fill="url(#rag-title)" letter-spacing="-0.5">Document Intelligence (RAG) — pipeline</text>
    <text x="96" y="192" font-size="22" fill="#a1a1aa">Simplified pipeline view · ingestion above, query below</text>
  </g>
  <g font-size="22" fill="#a1a1aa">
